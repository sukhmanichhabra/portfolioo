<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 380" fill="none">
  <!-- Dark background -->
  <rect width="644" height="380" fill="#111827"/>

  <!-- Subtle grid pattern overlay -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="644" height="380" fill="url(#grid)"/>

  <!-- Glow blobs -->
  <ellipse cx="200" cy="180" rx="160" ry="140" fill="#3E6EE8" opacity="0.07"/>
  <ellipse cx="440" cy="200" rx="140" ry="120" fill="#B8A800" opacity="0.06"/>

  <!-- Blue pill -->
  <g transform="translate(270, 140) rotate(-42)">
    <rect x="-28" y="-72" width="56" height="140" rx="28"
      fill="url(#slide_blue)" opacity="0.92"/>
  </g>
  <!-- Yellow pill -->
  <g transform="translate(320, 185) rotate(-42)">
    <rect x="-28" y="-72" width="56" height="140" rx="28"
      fill="url(#slide_yellow)" opacity="0.87"/>
  </g>

  <!-- Company name -->
  <text
    x="322" y="295"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-1"
  >Zehntech</text>

  <!-- Subtitle -->
  <text
    x="322" y="325"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="14"
    font-weight="400"
    fill="#9CA3AF"
    text-anchor="middle"
    letter-spacing="2"
  >TECHNOLOGIES PVT. LTD.</text>

  <!-- Internship badge -->
  <rect x="247" y="338" width="150" height="28" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text
    x="322" y="357"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12"
    font-weight="600"
    fill="#FCD34D"
    text-anchor="middle"
    letter-spacing="1"
  >SDE INTERN · 2025</text>

  <defs>
    <linearGradient id="slide_blue" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4A7FFF"/>
      <stop offset="100%" stop-color="#A8CEFF"/>
    </linearGradient>
    <linearGradient id="slide_yellow" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#C8B200"/>
      <stop offset="100%" stop-color="#EDE07A"/>
    </linearGradient>
  </defs>
</svg>
