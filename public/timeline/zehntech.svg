<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" fill="none">
  <!-- Blue pill rotated ~-40deg, positioned top -->
  <g transform="translate(68, 32) rotate(-42)">
    <rect x="-11" y="-30" width="22" height="58" rx="11"
      fill="url(#z_blue)" opacity="0.93"/>
  </g>
  <!-- Yellow pill rotated ~-40deg, positioned bottom-right -->
  <g transform="translate(85, 48) rotate(-42)">
    <rect x="-11" y="-30" width="22" height="58" rx="11"
      fill="url(#z_yellow)" opacity="0.88"/>
  </g>

  <!-- "Zehntech" bold text -->
  <text
    x="100" y="84"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="18"
    font-weight="800"
    fill="#1a1a1a"
    text-anchor="middle"
    letter-spacing="-0.3"
  >Zehntech</text>

  <defs>
    <linearGradient id="z_blue" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3E6EE8"/>
      <stop offset="100%" stop-color="#A8CEFF"/>
    </linearGradient>
    <linearGradient id="z_yellow" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#B8A800"/>
      <stop offset="100%" stop-color="#EDE07A"/>
    </linearGradient>
  </defs>
</svg>
